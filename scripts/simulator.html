<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ND Long Exposure Timer</title>
<style>
  :root {
    --ink: #e8e6e1;
    --dim: #8b8781;
    --line: #2f2d2a;
    --panel: #171614;
    --accent: #d8cfa8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0d0c0b; color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 28px 16px 48px;
  }
  h1 { font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin: 0; font-weight: 500; }
  .workbench { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .device { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  #frame {
    display: block; width: 244px; height: 500px;
    image-rendering: pixelated; background: #fff; border-radius: 3px;
  }
  .controls { display: flex; flex-direction: column; gap: 22px; width: 260px; }
  .pad { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: repeat(3, 62px); gap: 6px; justify-content: center; }
  button {
    font: inherit; color: var(--ink); background: #1c1a18; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; padding: 8px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:active { background: #262320; }
  .pad button { font-size: 18px; }
  .pad .centre { font-size: 11px; letter-spacing: .1em; }
  .pad .blank { visibility: hidden; }
  .shutter { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .shutter button { padding: 14px 8px; letter-spacing: .12em; }
  #shoot { background: #2b1f1c; border-color: #4a3029; }
  #shoot:hover { border-color: #b4685a; color: #e8a897; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0; }
  legend { color: var(--dim); letter-spacing: .14em; font-size: 11px; text-transform: uppercase; padding: 0 6px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0; color: var(--dim); }
  select { font: inherit; background: #1c1a18; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .note { color: var(--dim); font-size: 11px; margin-top: 6px; }
  .error { color: #c98b7d; }
  .keys { color: var(--dim); font-size: 12px; max-width: 560px; text-align: center; }
  .keys kbd { background: #1c1a18; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
</style>
</head>
<body>
<h1>ND Long Exposure Timer &mdash; simulator</h1>

<div class="workbench">
  <div class="device"><img id="frame" src="/frame.png" alt="e-paper panel"></div>

  <div class="controls">
    <div class="pad">
      <span class="blank"></span><button data-press="up">&#9650;</button><span class="blank"></span>
      <button data-press="left">&#9664;</button>
      <button data-press="centre" class="centre">OK</button>
      <button data-press="right">&#9654;</button>
      <span class="blank"></span><button data-press="down">&#9660;</button><span class="blank"></span>
    </div>

    <div class="shutter">
      <button data-press="sync">SYNC</button>
      <button data-press="shoot" id="shoot">SHOOT</button>
    </div>

    <fieldset>
      <legend>Camera</legend>
      <label>ISO <select id="iso"></select></label>
      <label>Aperture <select id="aperture"></select></label>
      <label>Shutter <select id="shutter"></select></label>
      <label>Connected <input type="checkbox" id="connected" checked></label>
      <div class="note" id="doing">idle</div>
      <div class="note error" id="error"></div>
    </fieldset>

    <fieldset>
      <legend>Exposure clock</legend>
      <label>Speed while shooting
        <select id="speed">
          <option value="1">real time</option>
          <option value="10">10&times;</option>
          <option value="60" selected>60&times;</option>
          <option value="300">300&times;</option>
        </select>
      </label>
    </fieldset>
  </div>
</div>

<p class="keys">
  <kbd>&larr;</kbd><kbd>&rarr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd> five-way &nbsp;
  <kbd>enter</kbd> centre &nbsp; <kbd>s</kbd> sync &nbsp; <kbd>b</kbd> shoot
  <br>
  The camera above is what SYNC reads. Press SHOOT again to cancel a running exposure.
</p>

<script>
const frame = document.getElementById('frame');
const KEYS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  Enter: 'centre', ' ': 'centre', s: 'sync', S: 'sync', b: 'shoot', B: 'shoot',
};
let polling = null;

function redraw() { frame.src = '/frame.png?t=' + Date.now(); }

function follow(state) {
  redraw();

  // What the camera is being asked to do, which the panel cannot show: the
  // device only knows what it told gphoto2, not what came back.
  const doing = document.getElementById('doing');
  if (doing) {
    doing.textContent = state.camera && !state.camera.connected ? 'unplugged'
      : state.doing ? `exposing: ${state.doing}` : 'idle';
  }

  // The panel only has room for the kind of failure. This is the sentence
  // behind it - what the journal would hold on the device itself.
  const error = document.getElementById('error');
  if (error) {
    error.textContent = state.error ? `gphoto2: ${state.error}` : '';
  }
  if (state.shooting && !polling) polling = setInterval(redraw, 400);
  if (!state.shooting && polling) { clearInterval(polling); polling = null; }
}

async function post(path) {
  follow(await (await fetch(path, { method: 'POST' })).json());
}

// Presses go one at a time: two fetches in flight can reach the server out of
// order, and a five-way whose steps arrive shuffled is a confusing thing to test.
let queue = Promise.resolve();
const press = (button) => {
  queue = queue.then(() => post('/press?button=' + button)).catch(() => {});
  return queue;
};

document.querySelectorAll('[data-press]').forEach((button) => {
  button.addEventListener('click', () => press(button.dataset.press));
});

document.addEventListener('keydown', (event) => {
  const button = KEYS[event.key];
  if (!button || event.metaKey || event.ctrlKey) return;
  event.preventDefault();
  press(button);
});

function sendCamera() {
  const value = (id) => document.getElementById(id).value;
  const on = document.getElementById('connected').checked ? 1 : 0;
  post(`/camera?iso=${value('iso')}&aperture=${value('aperture')}&shutter=${value('shutter')}&connected=${on}`);
}

document.getElementById('connected').addEventListener('change', sendCamera);

function fill(select, choices, current) {
  select.innerHTML = '';
  for (const [value, label] of choices) {
    const option = new Option(label, value, false, Math.abs(value - current) < 1e-9);
    select.add(option);
  }
  select.addEventListener('change', sendCamera);
}

document.getElementById('speed').addEventListener('change', (event) => {
  post('/speed?speed=' + event.target.value);
});

(async function start() {
  const state = await (await fetch('/state')).json();
  for (const name of ['iso', 'aperture', 'shutter']) {
    fill(document.getElementById(name), state.choices[name], state.camera[name]);
  }
  // The server owns this, not the markup: a checkbox that starts checked
  // whatever the simulator thinks will disagree with it after any reload, and
  // then every toggle is measured from the wrong place.
  document.getElementById('connected').checked = state.camera.connected;
  follow(state);
  post('/speed?speed=' + document.getElementById('speed').value);
})();
</script>
</body>
</html>
