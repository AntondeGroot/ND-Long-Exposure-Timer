# Lint, import-contract and coverage configuration. Test configuration stays in pytest.ini.
#
# There is no package to build here: the Pi runs main.py by path and imports
# nd_timer from the repository root, so this file exists only to hold tool
# settings that CI and a developer's machine must agree on.

[tool.ruff]
# 120 rather than the default 88. Measured, not chosen: at 100 the existing code
# has 30 violations and at 88 far more, which would mean a mass reformat. At 120
# there are 3, so the cap is enforceable today and still stops the genuinely long
# lines. Tighten it when the three are gone.
line-length = 120

# The Pi runs 3.13. Anything newer that ruff would suggest has nowhere to run.
target-version = "py313"

extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors - includes E402, which is load-bearing here:
            # main.py and the scripts import after adjusting sys.path, and those
            # suppressions are real. 12 lines rely on them.
    "W",    # pycodestyle warnings
    "F",    # pyflakes - unused imports and names
    "I",    # import sorting
    "UP",   # pyupgrade - syntax that 3.13 makes redundant
    "B",    # bugbear - likely bugs rather than style
    "C4",   # comprehension and literal shortcuts
    "SIM",  # simplifiable constructs
    "RUF",  # ruff's own rules, including unused-noqa
]

[tool.ruff.lint.isort]
known-first-party = ["nd_timer", "main"]

[tool.coverage.run]
branch = true

# main.py is deliberately absent: it imports the vendor panel driver and lgpio at
# module scope, so it cannot even be imported anywhere but the Pi. The logic
# worth testing lives in nd_timer, which is why the runtime is a thin shell
# around it - the simulator drives that same shell on a laptop.
source = ["nd_timer"]

[tool.coverage.report]
# TODO: raise towards 90, the target in ChecklistForProjects. Pinned just below
# the measured 89.00% so the gate is green today and can only ratchet upward - a
# floor set above current fails CI on arrival and blocks unrelated work. Move it
# up whenever the measured figure does; that is the whole point of a ratchet.
#
# The number is branch coverage rather than statement coverage, which is why it
# reads lower than it would elsewhere. The cheapest remaining ground is
# nd_timer/subjects.py at 92% and nd_timer/ui/navigation.py at 95%.
fail_under = 88
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A script's entry point, which no test reaches by design: the test calls
    # main() directly. Counting it as a miss would price honest coverage below
    # the same code with the guard deleted.
    'if __name__ == "__main__":',
]

[tool.importlinter]
root_packages = ["nd_timer"]
# Needed for the hardware contract: lgpio and spidev are only installed on the Pi, so
# they appear as external names rather than as modules the graph could resolve.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The device sits on its domain, never the other way round"
type = "layers"
# Each layer may import the ones below it and none above. A `|` row holds siblings
# that may not import each other either: the dial, the recipe and the filter bag
# each stand on exposure alone.
layers = [
    "nd_timer.saved_settings",
    "nd_timer.device",
    "nd_timer.ui",
    "nd_timer.recipe | nd_timer.dial | nd_timer.filter_bag | nd_timer.subjects | nd_timer.camera",
    "nd_timer.exposure",
]

[[tool.importlinter.contracts]]
name = "The screens draw; the drawing does not know the screens"
type = "layers"
containers = ["nd_timer.ui"]
layers = [
    "display | navigation",
    "screens | settings | panel",
    "render",
    "layout",
]

[[tool.importlinter.contracts]]
name = "The logic runs without the hardware"
type = "forbidden"
# What the simulator, the tests and CI run. Pulling the GPIO, SPI or battery code
# into any of it would make it importable only on the Pi.
source_modules = [
    "nd_timer.saved_settings",
    "nd_timer.device",
    "nd_timer.ui",
    "nd_timer.recipe",
    "nd_timer.dial",
    "nd_timer.filter_bag",
    "nd_timer.subjects",
    "nd_timer.exposure",
]
forbidden_modules = ["lgpio", "spidev", "nd_timer.fast_panel", "nd_timer.boot_splash", "nd_timer.battery"]

[[tool.importlinter.contracts]]
name = "The package never reaches back into the programs built on it"
type = "forbidden"
# main.py and the scripts import nd_timer. The reverse would be a cycle, and it would
# drag the Pi's runtime loop into everything the package's own tests import.
source_modules = ["nd_timer"]
forbidden_modules = ["main", "scripts"]

[tool.mutmut]
source_paths = ["nd_timer"]
# mutmut runs the suite from a copy of the repository in mutants/. The tests also
# read main.py, the scripts, the golden images and .python-version, so those go too.
also_copy = ["main.py", "scripts", "docs", "assets", ".python-version", "pytest.ini"]

[tool.mutation]
# Read by scripts/mutation-score.py, which CI runs after mutmut. TODO: raise towards
# 80, the top of the 70-80% target in ChecklistForProjects. Pinned just below the
# measured 77.8% so the gate is green today and can only ratchet upward. The most
# survivors are in nd_timer/ui/display.py, nd_timer/camera.py and nd_timer/subjects.py.
fail_under = 77
