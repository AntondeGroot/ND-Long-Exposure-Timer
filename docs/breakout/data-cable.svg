<text x="40.0" y="498.0" font-size="20" fill="#111" text-anchor="start" font-weight="bold">Notes</text>
<text x="40.0" y="530.0" font-size="18" fill="#444" text-anchor="start">•  Cable lengths not to scale.</text>
<text x="40.0" y="556.0" font-size="18" fill="#444" text-anchor="start">•  Put heat-shrink over the soldered end of the micro-USB plug.</text>
<text x="40.0" y="582.0" font-size="18" fill="#444" text-anchor="start">•  Socket wire colours vary between makers: check white and blue against the socket's D- and D+ with the meter.</text>
