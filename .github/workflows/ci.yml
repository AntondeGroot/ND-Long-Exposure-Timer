# The gate for every pull request. Two jobs rather than one so a red cross says
# which gate failed without opening the log, and so both can be required
# separately in the repository ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; say so rather than inheriting whatever
# the org default happens to be.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # .python-version is the one declaration of what this ships on; the
          # test suite reads the same file and refuses to run on anything else.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # --output-format=github puts each violation on the diff as an annotation
      # rather than only in the log. No --exit-zero anywhere: a warning is a
      # failure, which is the whole point of a zero-warning policy.
      - name: ruff
        run: ruff check --output-format=github .
      # Fails on any file the formatter would change, so formatting is never a
      # reviewer's job. Hand-laid tables (the shutter ladders, gphoto2 flag
      # pairs) sit between `# fmt: off` and `# fmt: on` to keep their shape.
      - name: ruff format
        run: ruff format --check --diff .
      # The import contracts in pyproject.toml: which part of nd_timer may lean on
      # which, and that the logic never pulls in the Pi's hardware.
      - name: import contracts
        run: lint-imports

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # .python-version is the one declaration of what this ships on; the
          # test suite reads the same file and refuses to run on anything else.
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Coverage settings, including the fail_under floor, live in pyproject.toml
      # so that running pytest locally gates exactly as CI does.
      - name: pytest
        run: pytest -q --cov

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Its own job, so a weak test shows as its own red cross rather than as a
      # failed test run. A couple of minutes: every mutant is a run of the suite.
      # The progress line redraws thousands of times, so only its end is kept.
      - name: mutmut
        run: mutmut run 2>&1 | tail -c 600
      - name: mutation score
        run: |
          mutmut export-cicd-stats
          python scripts/mutation-score.py
